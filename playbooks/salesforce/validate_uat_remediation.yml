---
- name: Validate Salesforce SAML remediation in UAT
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read approved IdP metadata
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: salesforce-saml-approved
        namespace: client-a-uat
      register: approved_config

    - name: Read active Salesforce metadata
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: salesforce-saml-active
        namespace: client-a-uat
      register: active_config

    - name: Read fake authentication deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: fake-auth-service
        namespace: client-a-uat
      register: auth_deployment

    - name: Confirm metadata is aligned
      ansible.builtin.assert:
        that:
          - >-
            approved_config.resources[0].data.certificate_fingerprint ==
            active_config.resources[0].data.certificate_fingerprint
          - >-
            approved_config.resources[0].data.metadata_version ==
            active_config.resources[0].data.metadata_version
        success_msg: "Salesforce-side metadata matches the approved IdP metadata."
        fail_msg: "Salesforce-side metadata is still inconsistent."

    - name: Confirm authentication deployment is healthy
      ansible.builtin.assert:
        that:
          - auth_deployment.resources[0].status.readyReplicas | default(0) >= 1
        success_msg: "fake-auth-service has at least 2 ready replicas."
        fail_msg: "fake-auth-service does not have the expected ready replicas."

    - name: Print validation evidence
      ansible.builtin.debug:
        msg:
          metadata_alignment: "passed"
          rollout_readiness: "passed"
          pilot_login_check: "demo_placeholder_passed"
          redirect_loop_check: "demo_placeholder_passed"
          authentication_failure_rate: "within_demo_baseline"