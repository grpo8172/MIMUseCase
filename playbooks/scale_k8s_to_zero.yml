---
- name: Scale approved Kubernetes deployment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    target_namespace: "client-a-uat"
    target_deployment: "fake-auth-service"
    desired_replicas: 0

  tasks:
    - name: Scale deployment through Kubernetes API
      ansible.builtin.command:
        argv:
          - kubectl
          - scale
          - "deployment/{{ target_deployment }}"
          - "--namespace={{ target_namespace }}"
          - "--replicas={{ desired_replicas }}"
      changed_when: true

    - name: Wait for scale-down
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - "--for=delete"
          - pod
          - "-l"
          - "app={{ target_deployment }}"
          - "--namespace={{ target_namespace }}"
          - "--timeout=120s"
      changed_when: false
      failed_when: false
      when: desired_replicas | int == 0

    - name: Show remaining pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - "--namespace={{ target_namespace }}"
          - "-o"
          - wide
      register: pod_output
      changed_when: false

    - name: Print pod placement
      ansible.builtin.debug:
        var: pod_output.stdout_lines