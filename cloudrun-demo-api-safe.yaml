apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mim-demo-api-safe
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"mongodb-mcp":["mongodb"],"mim-api":["mongodb","mongodb-mcp"]}'
    spec:
      serviceAccountName: mim-runtime@project-8ecd61cd-68ba-43c2-abd.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - name: mim-api
          image: australia-southeast1-docker.pkg.dev/project-8ecd61cd-68ba-43c2-abd/mim-images/mim-api:cors-fix-20260611-030721
          workingDir: /app
          command:
            - sh
            - -lc
          args:
            - exec uvicorn app.api.main:app --host 0.0.0.0 --port "${PORT:-8080}"
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              memory: 3Gi
              cpu: "1"

        - name: mongodb-mcp
          image: australia-southeast1-docker.pkg.dev/project-8ecd61cd-68ba-43c2-abd/mim-images/mongodb-mcp:latest
          resources:
            limits:
              memory: 3Gi
              cpu: "1"
          env:
            - name: MDB_MCP_CONNECTION_STRING
              value: mongodb://127.0.0.1:27017/mim?directConnection=true
            - name: MDB_MCP_TRANSPORT
              value: http
            - name: MDB_MCP_HTTP_HOST
              value: 0.0.0.0
            - name: MDB_MCP_HTTP_PORT
              value: "3000"
            - name: MDB_MCP_READ_ONLY
              value: "true"
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 3
            failureThreshold: 60
            
        - name: mongodb
          image: mongodb/mongodb-atlas-local:latest
          resources:
            limits:
              memory: 4Gi
              cpu: "2"
          startupProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 2
            timeoutSeconds: 2
            periodSeconds: 3
            failureThreshold: 60
